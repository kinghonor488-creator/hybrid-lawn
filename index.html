<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>杂交草坪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：上方木质种子栏 + 下方草坪画布；横屏矮屏时种子栏移到左侧。菜单、图鉴等界面浮在草坪之上。单一白天草坪画面，不跟随深色模式。 */
:root{
  --night:#1d2a14;
  --wood:#8a5a2e;
  --wood-dark:#5b3a1c;
  --wood-edge:#3e2611;
  --paper:#fff3d1;
  --paper-dim:#efe0b6;
  --ink:#2b1d10;
  --sun:#ffd23f;
  --leaf:#5fa832;
  --leaf-dark:#2f6b1c;
  --danger:#e3263a;
  --box:#8a4fd0;
  --box-dark:#3e1a6b;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--night);color:var(--paper);font:14px/1.45 var(--body);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
#app{
  position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
  padding-block:8px;
  padding-left:max(8px,env(safe-area-inset-left,0px));
  padding-right:max(8px,env(safe-area-inset-right,0px));
}
#bank{
  flex:none;display:flex;align-items:stretch;gap:6px;
  background:var(--wood);border:3px solid var(--wood-edge);border-radius:10px;padding:6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 3px 0 rgba(0,0,0,.35);
}
#sunbox{
  flex:none;width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--wood-dark);border-radius:7px;padding:4px 0;transition:background .15s;
}
#sunbox.nope{background:var(--danger)}
#sunIcon{width:30px;height:30px}
#sunNum{font-family:var(--display);font-size:18px;line-height:1;color:var(--paper);font-variant-numeric:tabular-nums}
#cards{display:flex;gap:5px;flex:1 1 auto;min-width:0}
.card,.tool{
  position:relative;overflow:hidden;border:2px solid var(--wood-edge);border-radius:7px;
  background:var(--paper);color:var(--ink);padding:0;cursor:pointer;
  transition:transform .12s,box-shadow .12s,filter .12s;
}
.card{flex:1 1 0;min-width:0;max-width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.card canvas{width:100%;max-width:46px;aspect-ratio:1;flex:1 1 auto;min-height:0;object-fit:contain}
.card .cost{font-family:var(--display);font-size:14px;line-height:1;padding:1px 0 4px;font-variant-numeric:tabular-nums}
.card .mask{position:absolute;left:0;right:0;top:0;height:0;background:rgba(20,14,6,.55);pointer-events:none}
.card.off{filter:brightness(.62) saturate(.7)}
.card.ready{animation:ready .5s ease-out}
@keyframes ready{0%{box-shadow:0 0 0 4px var(--sun)}100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}}
.card.sel,.tool.sel{transform:translateY(-3px);box-shadow:0 0 0 3px #fff,0 4px 0 rgba(0,0,0,.4)}
.card:focus-visible,.tool:focus-visible,.btn:focus-visible,.mbtn:focus-visible,.chip:focus-visible,.tile:focus-visible,.lv:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#tools{flex:none;display:flex;gap:5px}
.tool{width:44px;display:flex;align-items:center;justify-content:center}
#shovel canvas{width:36px;height:36px}
#side{display:flex;flex-direction:column;gap:5px}
#side .tool{width:40px;flex:1;font-family:var(--display);font-size:13px;background:var(--wood-dark);color:var(--paper);border-color:var(--wood-edge)}
#stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#game{display:block;border-radius:8px;box-shadow:0 0 0 3px var(--wood-edge),0 6px 18px rgba(0,0,0,.45);touch-action:none}

/* 浮层 */
#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(15,22,10,.55);padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));box-sizing:border-box}
#overlay.soft{background:linear-gradient(rgba(15,22,10,.1),rgba(15,22,10,.6))}
.panel{
  max-width:430px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box;
  background:var(--paper);color:var(--ink);border:4px solid var(--wood-edge);border-radius:14px;
  padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;
}
.panel.wide{max-width:780px}
.panel h1{margin:0;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;color:var(--leaf-dark);text-wrap:balance}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--wood-dark)}
.panel .sub{margin:0;font-family:var(--display);font-size:16px;color:var(--wood)}
.panel p{margin:0}
.panel ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.btn{
  font-family:var(--display);font-size:19px;padding:7px 20px;border-radius:10px;cursor:pointer;
  background:var(--leaf);color:#fff;border:3px solid var(--leaf-dark);box-shadow:0 3px 0 var(--leaf-dark);
}
.btn.alt{background:var(--wood);border-color:var(--wood-edge);box-shadow:0 3px 0 var(--wood-edge)}
.btn.small{font-size:15px;padding:4px 12px}
.btn:disabled{filter:grayscale(1) brightness(.85);cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-dark)}
.reward{display:flex;align-items:center;gap:12px;background:var(--paper-dim);border-radius:10px;padding:8px 12px}
.reward canvas{width:64px;height:64px;flex:none}
.reward b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--leaf-dark)}

/* 主菜单 */
.menu{display:grid;gap:14px;justify-items:center;align-items:center;max-height:100%;overflow:auto;padding:4px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo .l1{font-family:var(--display);font-size:clamp(46px,11vw,78px);color:var(--sun);-webkit-text-stroke:2px var(--wood-edge);text-shadow:0 5px 0 var(--wood-edge),0 10px 18px rgba(0,0,0,.4);letter-spacing:.04em}
.logo small{margin-top:8px;font-family:var(--display);font-size:16px;color:var(--paper);background:var(--wood-dark);border:2px solid var(--wood-edge);border-radius:999px;padding:2px 12px;letter-spacing:.08em}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(440px,100%)}
.mbtn{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
  background:var(--wood);color:var(--paper);border:3px solid var(--wood-edge);border-radius:12px;
  padding:10px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 4px 0 var(--wood-edge);
}
.mbtn b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.mbtn span{font-size:12px;opacity:.85}
.mbtn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 2px 0 var(--wood-edge)}
.mbtn.main{grid-column:1/-1;background:var(--leaf);border-color:var(--leaf-dark);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 var(--leaf-dark)}
.mbtn.lucky{background:var(--box);border-color:var(--box-dark);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 var(--box-dark)}
.rar{color:var(--wood-dark);font-weight:700;border-bottom:3px solid var(--rar)}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{cursor:pointer;font-size:13px;padding:4px 12px;border-radius:999px;background:rgba(43,29,16,.75);border:2px solid var(--wood-edge);color:var(--paper)}
.chip.warn{background:var(--danger);border-color:#7d0f1b}
@media (orientation:landscape) and (min-width:600px){
  .menu{grid-template-columns:auto minmax(0,440px);column-gap:36px}
  .mfoot{grid-column:1/-1}
}

/* 关卡与挑战 */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.lv{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;
  background:#fff;border:3px solid var(--wood);border-radius:10px;padding:8px 10px;color:var(--ink);
}
.lv b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--leaf-dark);line-height:1}
.lv .nm{font-size:13px;font-weight:600}
.lv .rw{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--wood)}
.lv .rw canvas{width:28px;height:28px}
.lv .st{position:absolute;top:6px;right:8px;font-family:var(--display);font-size:13px;color:var(--leaf)}
.lv.locked{background:var(--paper-dim);border-color:#c7b38a;color:#8b7a5c;cursor:not-allowed}
.lv.locked b{color:#8b7a5c}
.lv.done{border-color:var(--leaf)}

/* 选卡 */
.slots{display:flex;gap:6px;flex-wrap:wrap;min-height:60px;background:var(--wood);border-radius:10px;padding:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;
  background:#fff;border:2px solid var(--wood);border-radius:9px;padding:4px 2px 3px;color:var(--ink);
}
.tile canvas{width:52px;height:52px}
.tile .tn{font-size:11px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.on{border-color:var(--leaf);box-shadow:0 0 0 2px var(--leaf)}
.tile.used{opacity:.35}
.tile.cur{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.slots .tile{width:56px;background:var(--paper)}
.slots .tile canvas{width:44px;height:44px}

/* 图鉴 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{cursor:pointer;font-family:var(--display);font-size:16px;padding:4px 14px;border-radius:999px;border:2px solid var(--wood);background:transparent;color:var(--wood-dark)}
.tab.on{background:var(--wood);color:var(--paper)}
.alm{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:620px){.alm{grid-template-columns:minmax(0,1fr)}}
.detail{background:var(--paper-dim);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.detail .dtop{display:flex;gap:12px;align-items:center}
.detail canvas{width:96px;height:96px;flex:none;background:#fff8e4;border-radius:10px;border:2px solid var(--wood)}
.detail h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--leaf-dark)}
.detail .tag{font-size:12px;color:var(--wood)}
.detail .stat{font-size:13px;font-weight:600}
.detail .lore{font-size:13px;color:#5b4a35}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--wood);border-radius:10px;padding:8px 10px}
.ach .medal{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:#d9c9a3;color:#8b7a5c;border:2px solid #b8a27a}
.ach.got .medal{background:var(--sun);color:var(--wood-edge);border-color:#c98a00}
.ach b{display:block;font-size:14px}
.ach span{font-size:12px;color:#6b5a40}
.ach:not(.got){opacity:.7}

#toast{
  position:absolute;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:9;
  background:var(--wood-dark);color:var(--paper);border:3px solid var(--sun);border-radius:12px;
  padding:6px 16px;font-family:var(--display);font-size:17px;white-space:nowrap;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;pointer-events:none;opacity:0;
}
#toast.show{transform:translate(-50%,0);opacity:1}
#rotateHint{display:none;margin:0;text-align:center;font-family:var(--display);font-size:15px;color:#cfe3b0}
@media (orientation:portrait) and (max-width:600px){#rotateHint{display:block}}
/* 横屏手机：种子栏竖到左侧 */
@media (orientation:landscape) and (max-height:520px){
  #app{flex-direction:row}
  #bank{flex-direction:column;width:132px;box-sizing:border-box;overflow-y:auto}
  #sunbox{width:auto;flex-direction:row;gap:6px;padding:3px 0}
  #cards{display:grid;grid-template-columns:1fr 1fr;flex:none}
  .card{max-width:none;height:54px}
  .card canvas{max-width:36px}
  #tools{justify-content:space-between}
  #side{flex-direction:row}
  #shovel{width:34px;height:40px;flex:none}
  #shovel canvas{width:30px;height:30px}
  #side .tool{width:34px;height:40px;flex:none}
  .logo .l1{font-size:52px}
}
@media (prefers-reduced-motion:reduce){.card,.tool,#toast{transition:none}.card.ready{animation:none}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="杂交草坪">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* 独立运行时补上 Artifact 外壳原本提供的基础样式：安全区留白和零边距 */
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#1d2a14}
body{margin:0;height:100%}
</style>
</head>
<body>
<div id="app">
  <div id="bank">
    <div id="sunbox" title="阳光"><canvas id="sunIcon" width="60" height="60"></canvas><span id="sunNum">150</span></div>
    <div id="cards"></div>
    <div id="tools">
      <button id="shovel" class="tool" aria-label="铲子：移除植物"><canvas width="72" height="72"></canvas></button>
      <div id="side">
        <button id="speedBtn" class="tool" aria-label="切换速度">1×</button>
        <button id="pauseBtn" class="tool" aria-label="暂停">暂停</button>
      </div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <p id="rotateHint">把手机横过来，草坪会更大</p>
  <div id="overlay"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';
const W = 880, H = 500, LX = 70, TOP = 40, CW = 80, CH = 90, ROWS = 5, COLS = 9, MAX_SLOTS = 6, INTRO = 2.4;
const FONT = '"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",sans-serif';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let g = ctx; // 当前绘图上下文（图标会临时替换）

/* ================= 数据 ================= */
const PLANTS = {
  peaflower:    { name: '豌豆向日葵', cost: 75,  cd: 7.5, hp: 300,  desc: '产阳光，也会射豌豆',
                  stat: '每 20 秒产 25 阳光 · 每 2 秒射 1 颗豌豆（40 伤害）', lore: '向日葵和豌豆射手的孩子。白天晒太阳，顺手打僵尸。' },
  firepea:      { name: '火焰豌豆',   cost: 175, cd: 7.5, hp: 300,  desc: '火焰豌豆伤害翻倍，还会溅射',
                  stat: '每 1.5 秒 1 颗火焰豌豆（80 伤害，周围溅射 26）', lore: '豌豆射手和火炬树桩杂交，射出来的豌豆自带火焰。' },
  peanut:       { name: '豌豆坚果',   cost: 125, cd: 20,  hp: 2400, desc: '很耐啃的坚果，还能射豌豆',
                  stat: '2400 耐久 · 每 1.6 秒 1 颗豌豆（40 伤害）', lore: '坚果墙嘴里长出了豌豆射手的炮管，挡路也不闲着。' },
  icemine:      { name: '寒冰土豆雷', cost: 50,  cd: 25,  hp: 300,  desc: '12 秒后出土，炸伤并冻住附近僵尸',
                  stat: '12 秒出土 · 3600 伤害 · 冻结周围 6 秒', lore: '土豆雷在冰箱里睡了一晚，醒来浑身冒冷气。' },
  cherrynut:    { name: '樱桃坚果',   cost: 150, cd: 30,  hp: 4000, desc: '超厚坚果，被啃碎时炸飞周围僵尸',
                  stat: '4000 耐久 · 碎裂时 3×3 爆炸 3600 伤害', lore: '坚果头顶长着两颗樱桃炸弹，千万别咬穿它。' },
  snowrepeater: { name: '寒冰双发',   cost: 200, cd: 7.5, hp: 300,  desc: '一次射两颗冰豌豆，让僵尸减速',
                  stat: '每 1.5 秒 2 颗冰豌豆（各 40 伤害，减速 50%）', lore: '寒冰射手和双发射手杂交，冷得连说话都哆嗦。' },
  chompsquash:  { name: '大嘴窝瓜',   cost: 150, cd: 20,  hp: 300,  desc: '跳起来压扁面前的僵尸，再慢慢嚼',
                  stat: '压扁 3600 伤害 · 嚼 12 秒后能再出手', lore: '窝瓜有了大嘴花的胃口，压完还要吃掉。' },
  cherrypepper: { name: '樱桃辣椒',   cost: 125, cd: 35,  hp: 300,  desc: '点燃一整行，烧光这一行的僵尸',
                  stat: '一次性 · 整行 3600 火焰伤害', lore: '火爆辣椒头上顶着樱桃，脾气比两个加起来还大。' },
  spikenut:     { name: '地刺坚果',   cost: 100, cd: 7.5, hp: 600,  desc: '僵尸啃不动它，踩上去会被扎伤',
                  stat: '每秒扎伤上面的僵尸 40 · 每扎一下磨损 10 耐久（共 600）', lore: '地刺和坚果杂交，趴在地上，刺比坚果壳还硬。' },
  sunnut:       { name: '阳光坚果',   cost: 100, cd: 20,  hp: 1500, desc: '能挡僵尸的坚果，还会产阳光',
                  stat: '1500 耐久 · 每 25 秒产 25 阳光', lore: '坚果头上开了一圈向日葵花瓣，晒着太阳站岗。' },
  torchnut:     { name: '火炬坚果',   cost: 150, cd: 20,  hp: 2400, desc: '穿过它的豌豆会变成火焰豌豆',
                  stat: '2400 耐久 · 豌豆穿过变火焰豌豆，冰豌豆穿过会化开', lore: '火炬树桩钻进了坚果壳里，又能挡又能点火。' },
  garlicnut:    { name: '大蒜坚果',   cost: 75,  cd: 15,  hp: 1200, desc: '僵尸咬一口就嫌臭，换到隔壁行',
                  stat: '1200 耐久 · 僵尸咬它半秒就会换行', lore: '大蒜味的坚果。僵尸咬一口，皱着眉头就走了。' },
  threesnow:    { name: '三线寒冰',   cost: 300, cd: 7.5, hp: 300,  desc: '同时朝三行射冰豌豆',
                  stat: '每 1.5 秒朝上中下三行各射 1 颗冰豌豆（40 伤害，减速）', lore: '三线射手和寒冰射手杂交，三个脑袋一起打喷嚏。' },

/* ---------- 波次生成 ---------- */
function buildWave(i) {
  const flag = isFlag(i);
  let budget = Math.floor(CFG.base + i * CFG.grow);
  if (flag) budget = Math.floor(budget * 2.2) + 2;
  budget = Math.max(1, budget);
  const list = flag ? ['flag'] : [];
  while (budget > 0) {
    const opts = CFG.pool.filter(t => ZDEF[t].cost <= budget && ZDEF[t].cost <= 1 + i * 0.7);
    if (!opts.length) break;
    let sum = 0;
    const w = opts.map(t => { const v = 1 / ZDEF[t].cost + (ZDEF[t].cost > 1 ? 0.35 : 0); sum += v; return v; });
    let r = Math.random() * sum, pick = opts[0];
    for (let j = 0; j < opts.length; j++) { r -= w[j]; if (r <= 0) { pick = opts[j]; break; } }
    list.push(pick); budget -= ZDEF[pick].cost;
  }
  return list;
}

/* ================= 逻辑 ================= */
function makePlant(type) {
  const d = PLANTS[type];
  return { type, hp: d.hp, maxHp: d.hp, age: 0, shootT: type === 'icemelon' ? 1 : 0.6, sunT: type === 'sunnut' ? 10 : 7,
    armed: false, hurt: 0, recoil: 0, fuse: type === 'doomcherry' ? 1.3 : 1, chew: 0, atk: null, spikeT: 0, open: 0 };
}
// 开盒：按概率抽稀有度，再在这一档里随机挑一株
function rollBox(kind) {
  const odds = BOX_ODDS[kind];
  let sum = 0;
  for (const k in odds) sum += odds[k];
  let r = Math.random() * sum;
  for (const k in odds) {
    r -= odds[k];
    if (r <= 0) {
      if (k === 'zombie') return { zombie: true };
      const { plants, weights } = RARITY[k];
      let w = Math.random() * weights.reduce((a, b) => a + b, 0);
      for (let i = 0; i < plants.length; i++) { w -= weights[i]; if (w <= 0) return { plant: plants[i], rarity: k }; }
      return { plant: plants[0], rarity: k };
    }
  }
  return { plant: 'peaflower', rarity: 'common' };
}
function openBox(r, c, p) {
  const px = cellCX(c), py = cellCY(r);
  const res = rollBox(PLANTS[p.type].box);
  const gold = p.type === 'goldbox';
  for (let i = 0; i < 18; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(80, 260);
    part({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, grav: 400, life: rnd(0.5, 0.9), size: rnd(2, 5), shape: 'rect', vr: rnd(-10, 10),
      color: (gold ? ['#ffd23f', '#fff3a0', '#e3263a'] : ['#9b5de5', '#ffd23f', '#fff3d1'])[i % 3] });
  }
  if (res.zombie) {
    // 僵尸从这一行的路口冲进来，不会直接出现在房子门口
    S.plants[r][c] = null;
    spawnZombie(Math.random() < 0.6 ? 'normal' : 'cone', r, LX + CW * COLS + 10);
    floatText(px, py - 40, '坏运气！僵尸溜到路口了', '#ff6b5a', 20);
    S.boxZombies++;
    if (S.boxZombies >= 3) unlockAch('unlucky');
    sfx('lose');
    return;
  }
  const np = makePlant(res.plant);
  S.plants[r][c] = np;
  const rar = RARITY[res.rarity];
  floatText(px, py - 50, PLANTS[res.plant].name, rar.color, res.rarity === 'common' ? 18 : 22);
  if (!save.boxGot[res.plant]) { save.boxGot[res.plant] = true; persist(); }
  if (res.rarity === 'legendary') {
    unlockAch('legend');
    showBanner(`传说！${PLANTS[res.plant].name}`);
    S.shake = Math.max(S.shake, 6); S.flashA = 0.35;
    for (let i = 0; i < 24; i++) part({ x: px, y: py, vx: rnd(-200, 200), vy: rnd(-320, -80), grav: 300, life: rnd(0.8, 1.3), size: rnd(2, 4), color: '#ffd23f', shape: 'rect', vr: 12 });

function explodeDoom(r, c) {

function showBanner(text) { S.banner = { text, t: 0 }; sfx('horn'); }

function updateEffects(dt) {

  S.flashA = Math.max(0, S.flashA - dt * 2.5);
  for (const p of S.parts) {
    p.t += dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.ground != null && p.y > p.ground) { p.y = p.ground; p.vy *= -0.3; p.vx *= 0.6; p.vr *= 0.5; }
  }

function update(dt) {
  if (S.demo) { S.t += dt; for (const z of S.zombies) z.anim += dt * 0.6; return; }
  updateEffects(dt);
  if (S.intro < INTRO) {
    S.intro += dt;
    const step = Math.min(2, Math.floor(S.intro / (INTRO / 3)));
    if (step !== S.introStep && S.intro < INTRO) { S.introStep = step; sfx(step === 2 ? 'go' : 'tick'); }
    return;
  }
  S.t += dt;
  for (const k of S.deck) {
    const before = S.cd[k];
    S.cd[k] = Math.max(0, S.cd[k] - dt);
    if (before > 0 && S.cd[k] === 0 && cardEls[k]) { const b = cardEls[k].b; b.classList.remove('ready'); void b.offsetWidth; b.classList.add('ready'); }
  }
  if (S.banner) { S.banner.t += dt; if (S.banner.t > 3.2) S.banner = null; }
  if (S.sun >= 2000) unlockAch('rich');

  // 波次
  if (S.waveNum < CFG.waves) {
    const nxt = S.waveNum + 1;
    if (isFlag(nxt) && !S.bannerFor[nxt] && S.t >= S.nextWaveT - 4) {
      S.bannerFor[nxt] = true;
      showBanner(nxt === CFG.waves ? '最后一波！' : '一大波僵尸正在接近！');
    }
    if (S.t >= S.nextWaveT) {
      S.waveNum = nxt;
      buildWave(nxt).forEach((type, i) => S.pending.push({ t: S.t + i * 1.1, type }));
      S.nextWaveT += gapAfter(nxt);
      if (CFG.waves === Infinity && nxt > 10) unlockAch('endless10');
    }
  }
  for (const p of S.pending) if (p.t <= S.t) { spawnZombie(p.type); p.done = true; }
  S.pending = S.pending.filter(p => !p.done);

  if (CFG.skySun) {
    S.nextSky -= dt;
    if (S.nextSky <= 0) {
      S.nextSky = rnd(8, 11);
      addSun(rnd(LX + 40, LX + CW * COLS - 40), TOP - 10, rnd(TOP + 60, TOP + CH * ROWS - 40));
    }
  }

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.craters[r][c] > 0) S.craters[r][c] = Math.max(0, S.craters[r][c] - dt);

  // 植物
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = S.plants[r][c];
    if (!p) continue;
    const px = cellCX(c), py = cellCY(r);
    p.age += dt; p.hurt = Math.max(0, p.hurt - dt); p.recoil = Math.max(0, p.recoil - dt);
    switch (p.type) {
      case 'peaflower':
        p.sunT -= dt;
        if (p.sunT <= 0) { p.sunT = 20; addSun(px + rnd(-14, 14), py - 30, py + 14); }
        // fallthrough 射击
      case 'firepea': case 'peanut': case 'snowrepeater':
        p.shootT -= dt;
        if (p.shootT <= 0 && zombieAhead(r, px)) {
          p.shootT = p.type === 'peaflower' ? 2 : p.type === 'peanut' ? 1.6 : 1.5;
          p.recoil = 0.12;
          if (p.type === 'peanut') shoot(r, px + 34, py - 3, 'pea');
          else if (p.type === 'snowrepeater') { shoot(r, px + 24, py - 14, 'ice'); S.peas.push({ row: r, x: px - 4, y: py - 14, kind: 'ice', dmg: 20 }); }
          else shoot(r, px + 22, py - 14, p.type === 'firepea' ? 'fire' : 'pea');
        }
        break;
      case 'icemine':
        if (!p.armed && p.age >= 12) {
          p.armed = true;
          for (let i = 0; i < 8; i++) part({ x: px + rnd(-18, 18), y: py + 24, vx: rnd(-60, 60), vy: rnd(-160, -60), life: 0.5, size: rnd(2, 4), color: '#7a5530' });
        }
        if (p.armed && S.zombies.some(z => z.row === r && !z.dead && z.x - 16 < px + 38 && z.x > px - 30)) {
          S.plants[r][c] = null; explodeIce(r, c);
        }
        break;
      case 'chompsquash':
        if (p.atk) {
          p.atk.t += dt;
          if (!p.atk.hit && p.atk.t >= 0.4) {
            p.atk.hit = true;
            let n = 0;
            for (const z of S.zombies) if (z.row === r && Math.abs(z.x - p.atk.tx) < 48 && hurtZombie(z, 1800)) n++;
            comboCheck(n);
            S.shake = Math.max(S.shake, 8);
            floatText(p.atk.tx, py - 40, '啪！', '#ffe36b', 30);
            for (let i = 0; i < 12; i++) part({ x: p.atk.tx + rnd(-30, 30), y: py + 30, vx: rnd(-140, 140), vy: rnd(-180, -60), life: 0.6, size: rnd(3, 6), color: '#8a6a3e' });
            sfx('slam');
          }
          if (p.atk.t >= 0.8) { p.atk = null; p.chew = 12; }
        } else if (p.chew > 0) {
          p.chew -= dt;
          if (Math.random() < dt * 2) sfx('chomp');
        } else {
          let best = null;
          for (const z of S.zombies)
            if (z.row === r && !z.dead && z.jumping <= 0 && z.x > px - 30 && z.x < px + 130 && (!best || z.x < best.x)) best = z;
          if (best) { p.atk = { t: 0, tx: best.x, hit: false }; sfx('jump'); }
        }
        break;
      case 'cherrypepper':
        p.fuse -= dt;
        if (p.fuse <= 0) { S.plants[r][c] = null; burnRow(r); }
        break;
      case 'doomcherry':
        p.fuse -= dt;
        if (p.fuse <= 0) { S.plants[r][c] = null; explodeDoom(r, c); }
        break;
      case 'sunnut':
        p.sunT -= dt;
        if (p.sunT <= 0) { p.sunT = 25; addSun(px + rnd(-14, 14), py - 40, py + 14); }
        break;
      case 'spikenut':
        p.spikeT -= dt;
        if (p.spikeT <= 0) {
          p.spikeT = 1;
          let hits = 0;
          for (const z of S.zombies)
            if (z.row === r && !z.dead && z.jumping <= 0 && Math.abs(z.x - px) < 40) { hurtZombie(z, 20); hits++; }

            p.hp -= 10 * hits; p.hurt = 0.1;
            for (let i = 0; i < 4; i++) part({ x: px + rnd(-20, 20), y: py + 30, vx: rnd(-40, 40), vy: rnd(-140, -60), life: 0.35, size: 2.5, color: '#c9ced1', shape: 'rect', vr: 10 });
            sfx('hit');
            if (p.hp <= 0) killPlant(r, c);
          }
        }
        break;
      case 'threesnow':
        p.shootT -= dt;
        if (p.shootT <= 0 && [r - 1, r, r + 1].some(rr => rr >= 0 && rr < ROWS && zombieAhead(rr, px))) {
          p.shootT = 1.5; p.recoil = 0.12;
          for (const tr of [r - 1, r, r + 1]) if (tr >= 0 && tr < ROWS)
            S.peas.push({ row: tr, x: px + 20, y: py - 24, ty: cellCY(tr) - 14, kind: 'ice', dmg: 20 });
          sfx('shoot');
        }
        break;
      case 'icemelon':
        p.shootT -= dt;
        if (p.shootT <= 0) {
          let tgt = null;
          for (const z of S.zombies) if (z.row === r && !z.dead && z.x > px && z.x < W - 10 && (!tgt || z.x < tgt.x)) tgt = z;
          if (tgt) {
            p.shootT = 3; p.recoil = 0.25;
            S.lobs.push({ row: r, sx: px - 6, sy: py - 50, z: tgt, tx: tgt.x, t: 0, dur: 0.9 });
            sfx('jump');
          }
        }

  // 僵尸
  for (const z of S.zombies) {
    if (z.dead) {

      if (z.burnt && !z.ashed && z.deadT > 0.55) {
        z.ashed = true;
        const y = cellCY(z.row) + 32;
        for (let i = 0; i < 16; i++) part({ x: z.x + rnd(-16, 16), y: y - rnd(0, 90), vx: rnd(-30, 50), vy: rnd(-60, 10), grav: 120, life: rnd(0.5, 0.9), size: rnd(2, 5), color: i % 2 ? '#2a2a2a' : '#555' });
      }

    }
    z.flash = Math.max(0, z.flash - dt);
    if (z.rowShift) z.rowShift = Math.sign(z.rowShift) * Math.max(0, Math.abs(z.rowShift) - 150 * dt);

      if (tg.p.type === 'garlicnut') {
        z.garlicT += dt;
        if (z.garlicT >= 0.5) {
          // 嫌臭，换到隔壁一行
          const oldRow = z.row;
          const opts = [oldRow - 1, oldRow + 1].filter(rr => rr >= 0 && rr < ROWS);
          const nr = opts[Math.floor(Math.random() * opts.length)];

      }
      z.eating = true;
      tg.p.hp -= 100 * dt * k; tg.p.hurt = 0.1;
      z.chompT -= dt;
      if (z.chompT <= 0) {
        z.chompT = 0.45; sfx('chomp');
        part({ x: cellCX(tg.c) + 14, y: cellCY(z.row) + 4, vx: rnd(-40, 60), vy: rnd(-160, -80), life: 0.45, size: 3, color: '#7fc04a', shape: 'rect', vr: 8 });
      }
      if (tg.p.hp <= 0) killPlant(z.row, tg.c);
    } else {
      z.eating = false;
      z.x -= z.speed * k * dt;
    }
    const m = S.mowers[z.row];
    if (z.x < LX + 4 && m.state === 'ready') { m.state = 'go'; S.mowerUsed = true; sfx('mower'); }
    if (z.x < 12 && m.state === 'done') { gameOver(false); return; }
  }
  S.zombies = S.zombies.filter(z => !(z.dead && z.deadT > 1) && z.x > -60);

  // 小推车
  S.mowers.forEach((m, r) => {
    if (m.state !== 'go') return;
    m.x += 330 * dt;
    if (Math.random() < 0.6) part({ x: m.x, y: cellCY(r) + 28, vx: rnd(-120, -40), vy: rnd(-80, -20), grav: 100, life: 0.4, size: rnd(2, 4), color: '#cbb48a' });
    for (const z of S.zombies)
      if (z.row === r && !z.dead && Math.abs(z.x - (m.x + 20)) < 30) { z.armor = 0; hurtZombie(z, 9999); }
    if (m.x > W + 40) m.state = 'done';
  });

  // 豌豆
  for (const p of S.peas) {
    p.x += 320 * dt;
    if (p.ty != null) p.y += (p.ty - p.y) * Math.min(1, dt * 10);

    let hit = null;

      if (p.kind === 'fire') {
        for (const z of S.zombies) if (z !== hit && z.row === p.row && Math.abs(z.x - hit.x) < 50) hurtZombie(z, 13);
        hit.slow = 0;
        sfx('firehit');
      } else if (p.kind === 'ice') { hit.slow = 4; sfx('icehit'); }
      else sfx('hit');
      const col = p.kind === 'fire' ? ['#ff8a2b', '#ffe36b'] : p.kind === 'ice' ? ['#bfe9ff', '#7fd3ff'] : ['#8fe04a', '#5fa832'];
      for (let i = 0; i < 5; i++) part({ x: p.x, y: p.y, vx: rnd(-140, 40), vy: rnd(-160, 60), grav: 500, life: 0.3, size: rnd(2, 4), color: col[i % 2], shape: p.kind === 'ice' ? 'rect' : 'circle', vr: 10 });
      p.gone = true;
    } else if (p.x > W + 20) p.gone = true;
  }
  S.peas = S.peas.filter(p => !p.gone);

  // 冰西瓜：抛物线飞向目标，落地溅射并减速
  for (const l of S.lobs) {
    l.t += dt;
    if (l.z && !l.z.dead) l.tx = l.z.x;
    if (l.t >= l.dur) {
      l.gone = true;
      const y = cellCY(l.row);
      for (const z of S.zombies) {
        if (z.dead || z.row !== l.row) continue;
        const d = Math.abs(z.x - l.tx);
        if (d < 70) { hurtZombie(z, d < 20 ? 80 : 26); z.slow = 4; }
      }
      for (let i = 0; i < 12; i++) part({ x: l.tx, y: y - 20, vx: rnd(-160, 160), vy: rnd(-220, -40), grav: 500, life: 0.5, size: rnd(2, 5), color: i % 2 ? '#bfe9ff' : '#6fbf5a', shape: 'rect', vr: 10 });
      sfx('icehit'); sfx('slam');
    }
  }
  S.lobs = S.lobs.filter(l => !l.gone);

  // 阳光
  for (const s of S.suns) {
    if (s.fly) { s.flyT += dt; continue; }
    if (s.y < s.targetY) s.y = Math.min(s.targetY, s.y + 60 * dt);
    else { s.life -= dt; if (s.life <= 0) s.gone = true; }
  }
  S.suns = S.suns.filter(s => !s.gone && !(s.fly && s.flyT > 0.5));

  // 胜利判定
  if (S.waveNum >= CFG.waves && S.pending.length === 0 && S.zombies.length === 0) {
    S.ending += dt;
    if (S.ending > 1.2) gameOver(true);
  }
}

/* ================= 绘制 ================= */
function ell(x, y, rx, ry, fill, stroke, lw) {
  g.beginPath();
  g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 2.5; g.stroke(); }
}
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function line(x1, y1, x2, y2, color, lw) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
  g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.stroke();
}
function poly(pts, fill, stroke, lw = 2.5) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function shadow(x, y, w) { ell(x, y, w, w * 0.28, 'rgba(0,0,0,.2)'); }
function stem(x, y, top) {
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 7, (y + top) / 2, x, top);
  g.strokeStyle = '#3d7a22'; g.lineWidth = 5; g.lineCap = 'round'; g.stroke();
  ell(x - 10, y - 3, 11, 4, '#5fa832', '#2f6b1c', 1.5);
  ell(x + 10, y - 3, 11, 4, '#5fa832', '#2f6b1c', 1.5);
}
function peaHead(x, y, r, body, dark) {
  ell(x - r * 0.95, y - r * 0.6, r * 0.45, r * 0.22, body, dark, 1.5);
  g.beginPath(); g.rect(x + r * 0.3, y - r * 0.42, r * 1.05, r * 0.84);
  g.fillStyle = body; g.fill(); g.strokeStyle = dark; g.lineWidth = 2.5; g.stroke();
  ell(x + r * 1.38, y, r * 0.3, r * 0.52, body, dark);
  ell(x + r * 1.43, y, r * 0.15, r * 0.32, dark);
  ell(x, y, r, r, body, dark);
  ell(x + r * 0.2, y - r * 0.32, r * 0.24, r * 0.3, '#fff', dark, 1.5);
  ell(x + r * 0.28, y - r * 0.3, r * 0.11, r * 0.16, '#111');
}
function flame(x, y, s, t) {
  const f = Math.sin(t * 12) * s * 0.12;
  const path = k => {
    g.beginPath(); g.moveTo(x - s * 0.6 * k, y);
    g.quadraticCurveTo(x - s * k, y - s * 0.9 * k, x - s * 0.5 * k + f, y - s * 1.7 * k);
    g.quadraticCurveTo(x - s * 0.15 * k, y - s * k, x + s * 0.1 * k, y - s * 1.35 * k - f);
    g.quadraticCurveTo(x + s * 0.5 * k, y - s * 0.6 * k, x + s * 0.4 * k, y);
    g.closePath();
  };
  path(1); g.fillStyle = '#ffb12b'; g.fill(); g.strokeStyle = '#c2410c'; g.lineWidth = 2; g.stroke();
  path(0.55); g.fillStyle = '#ffe36b'; g.fill();
}
function nut(x, y, ratio) {
  ell(x, y - 30, 24, 31, '#d9a061', '#6e4520', 3);
  ell(x + 7, y - 17, 13, 11, 'rgba(110,69,32,.18)');
  ell(x - 7, y - 40, 5, 6.5, '#fff', '#3b2410', 1.5);
  ell(x + 8, y - 40, 5, 6.5, '#fff', '#3b2410', 1.5);
  ell(x - 5, y - 39, 2.4, 3, '#111');
  ell(x + 10, y - 39, 2.4, 3, '#111');
  g.beginPath();
  if (ratio > 0.5) g.arc(x + 1, y - 30, 6, 0.2 * Math.PI, 0.8 * Math.PI);
  else g.arc(x + 1, y - 22, 6, 1.2 * Math.PI, 1.8 * Math.PI);
  g.strokeStyle = '#3b2410'; g.lineWidth = 2; g.stroke();
  g.strokeStyle = '#5b3613'; g.lineWidth = 2;
  if (ratio < 0.66) { g.beginPath(); g.moveTo(x - 18, y - 50); g.lineTo(x - 10, y - 44); g.lineTo(x - 15, y - 36); g.lineTo(x - 8, y - 30); g.stroke(); }
  if (ratio < 0.33) { g.beginPath(); g.moveTo(x + 20, y - 46); g.lineTo(x + 12, y - 38); g.lineTo(x + 18, y - 28); g.lineTo(x + 11, y - 20); g.stroke(); }
}
function cherries(x, y) {
  line(x + 2, y - 16, x - 9, y - 2, '#3d7a22', 2.5);
  line(x + 2, y - 16, x + 11, y - 4, '#3d7a22', 2.5);
  ell(x + 5, y - 17, 6, 3, '#5fa832', '#2f6b1c', 1.2);
  ell(x - 9, y + 3, 9, 9, '#e3263a', '#7d0f1b', 2);
  ell(x + 11, y + 1, 9, 9, '#e3263a', '#7d0f1b', 2);
  ell(x - 12, y, 2.5, 2, 'rgba(255,255,255,.7)');
  ell(x + 8, y - 2, 2.5, 2, 'rgba(255,255,255,.7)');
}

function drawPlant(type, x, y, t, p) {
  const bob = Math.sin(t * 2.2 + x * 0.05) * 1.5;
  const ratio = p ? p.hp / p.maxHp : 1;
  const rc = p && p.recoil > 0 ? -3 : 0;
  g.save();
  // 种下时的弹跳
  if (p && p.age < 0.3) {
    const k = p.age / 0.3;
    const sy = 0.55 + 0.45 * k + Math.sin(k * Math.PI) * 0.2, sx = 1 + Math.sin(k * Math.PI) * 0.12;
    g.translate(x, y); g.scale(sx, sy); g.translate(-x, -y);
  }
  if (p && p.hurt > 0) g.translate(Math.sin(t * 60) * 1.2, 0);
  switch (type) {
    case 'peaflower': {
      shadow(x, y + 2, 22);
      stem(x, y, y - 32 + bob);
      const hx = x + rc, hy = y - 42 + bob, r = 15;
      g.save(); g.translate(hx, hy); g.rotate(t * 0.4);
      for (let i = 0; i < 12; i++) { g.save(); g.rotate(i * Math.PI / 6); ell(r + 6, 0, 8, 4.5, '#ffd23f', '#c98a00', 1.5); g.restore(); }
      g.restore();
      peaHead(hx, hy, r, '#8fd14f', '#2f6b1c');
      break;
    }
    case 'firepea': {
      shadow(x, y + 2, 22);
      stem(x, y, y - 30 + bob);
      const hx = x - 2 + rc, hy = y - 40 + bob;
      flame(hx - 9, hy - 6, 15, t);
      peaHead(hx, hy, 16, '#ff7d36', '#8a2c0a');
      break;
    }
    case 'snowrepeater': {
      shadow(x, y + 2, 22);
      stem(x, y, y - 30 + bob);
      const hx = x - 2 + rc, hy = y - 40 + bob;
      poly([hx - 14, hy - 8, hx - 22, hy - 30, hx - 6, hy - 14], '#e8f7ff', '#1f5f86', 2);
      poly([hx - 6, hy - 14, hx - 8, hy - 36, hx + 4, hy - 15], '#e8f7ff', '#1f5f86', 2);
      peaHead(hx, hy, 16, '#7fd3ff', '#1f5f86');
      ell(hx - 4, hy + 6, 4, 3, 'rgba(255,255,255,.6)');
      break;
    }
    case 'peanut': {
      shadow(x, y + 2, 26);
      nut(x, y, ratio);
      g.beginPath(); g.rect(x + 15 + rc, y - 39, 18, 14);
      g.fillStyle = '#8fd14f'; g.fill(); g.strokeStyle = '#2f6b1c'; g.lineWidth = 2.5; g.stroke();
      ell(x + 33 + rc, y - 32, 4.5, 8, '#8fd14f', '#2f6b1c');
      ell(x + 34 + rc, y - 32, 2.3, 5, '#1f3d12');
      ell(x + 3, y - 63, 9, 4, '#5fa832', '#2f6b1c', 1.5);
      break;
    }
    case 'cherrynut': {
      const j = ratio < 0.33 ? Math.sin(t * 40) * 1.5 : 0;
      shadow(x, y + 2, 26);
      g.translate(j, 0);
      nut(x, y, ratio);
      cherries(x, y - 60);
      break;
    }
    case 'icemine': {
      const armed = !p || p.armed;
      if (!armed) {
        const k = Math.min(1, p.age / 12);
        ell(x, y - 1, 20, 7, '#7a5530', '#4a3218', 2);
        ell(x, y - 3 - k * 5, 12, 4 + k * 4, '#c6e6f6', '#3c6e8f', 2);
        ell(x, y + 1, 22, 5, '#7a5530');
      } else {
        shadow(x, y + 2, 26);
        line(x, y - 28, x + 3, y - 40, '#3c6e8f', 2.5);
        const on = Math.sin(t * 6) > 0;
        if (on) ell(x + 3, y - 42, 9, 9, 'rgba(79,209,255,.3)');
        ell(x + 3, y - 42, 4.5, 4.5, on ? '#4fd1ff' : '#1f6f8f', '#1d3b52', 1.5);
        ell(x, y - 13, 24, 17, '#c6e6f6', '#3c6e8f', 2.5);
        ell(x - 12, y - 20, 4, 2.5, '#fff');
        ell(x + 13, y - 8, 3, 2, '#fff');
        ell(x - 7, y - 16, 3.5, 4.5, '#fff', '#1d3b52', 1);
        ell(x + 7, y - 16, 3.5, 4.5, '#fff', '#1d3b52', 1);
        ell(x - 6, y - 15, 1.8, 2.4, '#111');
        ell(x + 8, y - 15, 1.8, 2.4, '#111');
        ell(x, y, 27, 6, '#7a5530');
      }
      break;
    }
    case 'chompsquash': {
      let ox = 0, oy = 0, sq = 1;
      if (p && p.atk) {
        const k = Math.min(1, p.atk.t / 0.4);
        if (p.atk.t < 0.4) { ox = (p.atk.tx - x) * k; oy = -Math.sin(k * Math.PI) * 70; }
        else { const k2 = clamp01((p.atk.t - 0.4) / 0.4); ox = (p.atk.tx - x) * (1 - k2); oy = -Math.sin(k2 * Math.PI) * 30; sq = p.atk.t < 0.5 ? 0.7 : 1; }
      }
      const chew = p && p.chew > 0;
      shadow(x + ox, y + 2, 26);
      g.translate(x + ox, y + oy); g.scale(1 / sq * (sq < 1 ? 1.2 : 1), sq); g.translate(-(x + ox), -(y + oy));
      const cx = x + ox, cy = y + oy;
      const cheek = chew ? Math.abs(Math.sin(t * 8)) * 3 : 0;
      rr(cx - 24 - cheek, cy - 58, 48 + cheek * 2, 58, 18);
      g.fillStyle = '#9ccf3c'; g.fill(); g.strokeStyle = '#3f6b12'; g.lineWidth = 3; g.stroke();
      line(cx - 8, cy - 56, cx - 10, cy - 4, 'rgba(63,107,18,.35)', 2);
      line(cx + 8, cy - 56, cx + 10, cy - 4, 'rgba(63,107,18,.35)', 2);
      ell(cx + 1, cy - 62, 6, 4, '#5fa832', '#2f6b1c', 1.5);
      if (chew) {
        line(cx - 2, cy - 22, cx + 22, cy - 22, '#5b1d6b', 3);
        ell(cx - 10, cy - 40, 5, 1.5, '#2b1d10');
        ell(cx + 8, cy - 40, 5, 1.5, '#2b1d10');
      } else {
        line(cx - 16, cy - 48, cx - 4, cy - 43, '#2b1d10', 3);
        line(cx + 16, cy - 48, cx + 4, cy - 43, '#2b1d10', 3);
        ell(cx - 9, cy - 38, 4, 4.5, '#fff', '#2b1d10', 1.2);
        ell(cx + 9, cy - 38, 4, 4.5, '#fff', '#2b1d10', 1.2);
        ell(cx - 7, cy - 37, 1.8, 2.2, '#111');
        ell(cx + 11, cy - 37, 1.8, 2.2, '#111');
        ell(cx + 6, cy - 18, 14, 8, '#8e2ea6', '#4a1157', 2);
        ell(cx + 6, cy - 17, 10, 4, '#3a0d47');
        for (let i = 0; i < 4; i++) poly([cx - 4 + i * 6, cy - 21, cx - 1 + i * 6, cy - 15, cx + 2 + i * 6, cy - 21], '#fff');
      }
      break;
    }
    case 'cherrypepper': {
      const fuse = p ? 1 - p.fuse : 0;
      const sc = 1 + fuse * 0.35, jx = p ? Math.sin(t * 50) * fuse * 3 : 0;
      shadow(x, y + 2, 20);
      g.translate(x + jx, y); g.scale(sc, sc); g.translate(-x, -y);
      g.beginPath();
      g.moveTo(x - 4, y - 56);
      g.bezierCurveTo(x + 20, y - 54, x + 18, y - 20, x + 4, y - 2);
      g.bezierCurveTo(x - 4, y + 4, x - 18, y - 16, x - 16, y - 34);
      g.bezierCurveTo(x - 15, y - 48, x - 12, y - 56, x - 4, y - 56);
      g.fillStyle = fuse > 0.5 && Math.sin(t * 30) > 0 ? '#ff5a3a' : '#d81f2a'; g.fill();
      g.strokeStyle = '#6e0c12'; g.lineWidth = 2.5; g.stroke();
      ell(x - 8, y - 42, 3, 7, 'rgba(255,255,255,.35)');
      line(x - 9, y - 32, x - 2, y - 28, '#2b1d10', 2.5);
      line(x + 9, y - 32, x + 2, y - 28, '#2b1d10', 2.5);
      ell(x - 5, y - 24, 2.4, 3, '#111'); ell(x + 5, y - 24, 2.4, 3, '#111');
      g.beginPath(); g.arc(x, y - 12, 5, 1.15 * Math.PI, 1.85 * Math.PI); g.strokeStyle = '#2b1d10'; g.lineWidth = 2; g.stroke();
      cherries(x - 2, y - 70);
      break;
    }
    case 'spikenut': {
      shadow(x, y + 2, 30);
      g.beginPath(); g.ellipse(x, y, 32, 16, 0, Math.PI, Math.PI * 2); g.closePath();
      g.fillStyle = '#c98a4b'; g.fill(); g.strokeStyle = '#6e4520'; g.lineWidth = 2.5; g.stroke();
      for (let i = 0; i < 7; i++) {
        const sx = x - 27 + i * 9, sh = 9 + (i % 2) * 4;
        poly([sx - 4, y - 8 + Math.abs(i - 3) * 1.5, sx + 4, y - 8 + Math.abs(i - 3) * 1.5, sx, y - 8 - sh + Math.abs(i - 3) * 1.5], '#d9dde0', '#5b6166', 1.5);
      }
      ell(x - 8, y - 6, 3.5, 4, '#fff', '#3b2410', 1.2); ell(x + 8, y - 6, 3.5, 4, '#fff', '#3b2410', 1.2);
      ell(x - 6, y - 5, 1.8, 2.2, '#111'); ell(x + 10, y - 5, 1.8, 2.2, '#111');
      if (ratio < 0.4) line(x - 20, y - 4, x - 12, y - 1, '#5b3613', 2);
      break;
    }
    case 'sunnut': {
      shadow(x, y + 2, 26);
      g.save(); g.translate(x, y - 52); g.rotate(t * 0.3);
      for (let i = 0; i < 10; i++) { g.save(); g.rotate(i * Math.PI / 5); ell(16, 0, 9, 5, '#ffd23f', '#c98a00', 1.5); g.restore(); }
      g.restore();
      nut(x, y, ratio);
      ell(x - 13, y - 30, 4, 2.5, 'rgba(255,120,80,.45)'); ell(x + 15, y - 30, 4, 2.5, 'rgba(255,120,80,.45)');
      break;
    }
    case 'torchnut': {
      shadow(x, y + 2, 26);
      flame(x + 1, y - 56, 16, t);
      ell(x, y - 30, 24, 31, '#a8673a', '#4a2a12', 3);
      for (let i = 0; i < 3; i++) line(x - 18 + i * 3, y - 46 + i * 14, x + 18 - i * 3, y - 46 + i * 14, 'rgba(74,42,18,.45)', 2);
      ell(x - 7, y - 36, 5, 6.5, '#ffe36b', '#3b2410', 1.5);
      ell(x + 8, y - 36, 5, 6.5, '#ffe36b', '#3b2410', 1.5);
      ell(x - 5, y - 35, 2.4, 3, '#111'); ell(x + 10, y - 35, 2.4, 3, '#111');
      line(x - 14, y - 46, x - 3, y - 43, '#2b1d10', 2.5); line(x + 15, y - 46, x + 4, y - 43, '#2b1d10', 2.5);
      if (ratio < 0.66) line(x - 18, y - 22, x - 8, y - 14, '#2b1d10', 2);
      if (ratio < 0.33) line(x + 18, y - 26, x + 9, y - 16, '#2b1d10', 2);
      break;
    }
    case 'garlicnut': {
      shadow(x, y + 2, 24);
      g.beginPath();
      g.moveTo(x, y - 66);
      g.bezierCurveTo(x + 6, y - 56, x + 30, y - 48, x + 26, y - 20);
      g.bezierCurveTo(x + 24, y - 2, x - 24, y - 2, x - 26, y - 20);
      g.bezierCurveTo(x - 30, y - 48, x - 6, y - 56, x, y - 66);
      g.fillStyle = '#f4efe2'; g.fill(); g.strokeStyle = '#8a7a63'; g.lineWidth = 2.5; g.stroke();
      line(x - 10, y - 50, x - 14, y - 8, 'rgba(155,93,229,.45)', 2);
      line(x + 10, y - 50, x + 14, y - 8, 'rgba(155,93,229,.45)', 2);
      line(x, y - 58, x, y - 6, 'rgba(155,93,229,.3)', 2);
      ell(x - 8, y - 30, 4, 3, '#fff', '#3b2410', 1.2); ell(x + 8, y - 30, 4, 3, '#fff', '#3b2410', 1.2);
      ell(x - 7, y - 29, 1.8, 1.8, '#111'); ell(x + 9, y - 29, 1.8, 1.8, '#111');
      line(x - 13, y - 37, x - 4, y - 35, '#3b2410', 2); line(x + 13, y - 37, x + 4, y - 35, '#3b2410', 2);
      line(x - 5, y - 20, x + 5, y - 21, '#3b2410', 2);
      if (ratio < 0.5) line(x - 18, y - 40, x - 10, y - 30, '#8a7a63', 2);
      break;
    }
    case 'threesnow': {
      shadow(x, y + 2, 24);
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 6, y - 30, x - 4, y - 50);
      g.strokeStyle = '#2f6b8a'; g.lineWidth = 5; g.lineCap = 'round'; g.stroke();
      line(x - 2, y - 30, x + 6, y - 40, '#2f6b8a', 4);
      ell(x - 10, y - 3, 11, 4, '#8fd3e8', '#1f5f86', 1.5); ell(x + 10, y - 3, 11, 4, '#8fd3e8', '#1f5f86', 1.5);
      peaHead(x - 6 + rc, y - 62 + bob, 11, '#7fd3ff', '#1f5f86');
      peaHead(x + 8 + rc, y - 42 + bob, 11, '#7fd3ff', '#1f5f86');
      peaHead(x - 6 + rc, y - 22 + bob, 11, '#7fd3ff', '#1f5f86');
      break;
    }
    case 'icemelon': {
      shadow(x, y + 2, 26);
      const lift = p && p.recoil > 0 ? 10 : 0;
      ell(x - 4, y - 18, 22, 18, '#9fd8a8', '#2f6b4a', 2.5);
      ell(x - 4, y - 8, 26, 8, '#6fbf5a', '#2f6b1c', 2);
      ell(x - 10, y - 22, 3.5, 4.5, '#fff', '#1f3d12', 1); ell(x + 4, y - 22, 3.5, 4.5, '#fff', '#1f3d12', 1);
      ell(x - 8, y - 21, 1.8, 2.2, '#111'); ell(x + 6, y - 21, 1.8, 2.2, '#111');
      line(x - 2, y - 30, x - 18, y - 52 - lift, '#3d7a22', 4);
      g.beginPath(); g.ellipse(x - 20, y - 54 - lift, 14, 7, 0, 0, Math.PI); g.fillStyle = '#5a8a3a'; g.fill();
      if (!p || p.shootT > 0.4) {
        ell(x - 20, y - 62 - lift, 13, 11, '#8fd8c8', '#1f5f6a', 2);
        line(x - 26, y - 70 - lift, x - 26, y - 54 - lift, 'rgba(31,95,106,.5)', 2);
        line(x - 18, y - 72 - lift, x - 18, y - 52 - lift, 'rgba(31,95,106,.5)', 2);
        ell(x - 24, y - 66 - lift, 3, 2, '#fff');
      }
      break;
    }
    case 'doomcherry': {
      const fuse = p ? 1 - p.fuse / 1.3 : 0;
      const sc = 1 + fuse * 0.4, jx = p ? Math.sin(t * 50) * fuse * 3 : 0;
      shadow(x, y + 2, 24);
      g.translate(x + jx, y); g.scale(sc, sc); g.translate(-x, -y);
      g.beginPath(); g.rect(x - 9, y - 26, 18, 26); g.fillStyle = '#e8ddf0'; g.fill(); g.strokeStyle = '#4a2a5a'; g.lineWidth = 2; g.stroke();
      g.beginPath(); g.ellipse(x, y - 30, 30, 22, 0, Math.PI, Math.PI * 2); g.closePath();
      g.fillStyle = fuse > 0.5 && Math.sin(t * 30) > 0 ? '#7b2fa0' : '#3a1446'; g.fill(); g.strokeStyle = '#1a0820'; g.lineWidth = 2.5; g.stroke();
      ell(x - 14, y - 40, 5, 3, 'rgba(255,255,255,.35)'); ell(x + 10, y - 44, 4, 3, 'rgba(255,255,255,.3)');
      ell(x - 4, y - 16, 2.5, 3, '#111'); ell(x + 4, y - 16, 2.5, 3, '#111');
      line(x - 8, y - 22, x - 2, y - 19, '#111', 2); line(x + 8, y - 22, x + 2, y - 19, '#111', 2);
      cherries(x, y - 62);
      break;
    }
    case 'luckybox': case 'goldbox': {
      const gold = type === 'goldbox';
      const k = p ? Math.min(1, p.open / 0.9) : 0;
      const jit = p ? Math.sin(t * 50) * k * 4 : 0;
      shadow(x, y + 2, 26);
      g.translate(x + jit, y); g.scale(1 + k * 0.12, 1 - k * 0.06); g.translate(-x, -y);
      const body = gold ? '#f2b33d' : '#8a4fd0', dark = gold ? '#8a5a10' : '#3e1a6b', rib = gold ? '#e3263a' : '#ffd23f';
      rr(x - 24, y - 40, 48, 40, 5); g.fillStyle = body; g.fill(); g.strokeStyle = dark; g.lineWidth = 2.5; g.stroke();
      rr(x - 27, y - 48 - k * 6, 54, 12, 4); g.fillStyle = body; g.fill(); g.stroke();
      g.fillStyle = rib; g.fillRect(x - 5, y - 48 - k * 6, 10, 48 + k * 6);
      ell(x - 9, y - 52 - k * 6, 9, 5, rib, dark, 1.5); ell(x + 9, y - 52 - k * 6, 9, 5, rib, dark, 1.5);
      g.font = `22px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 4; g.strokeStyle = dark; g.strokeText('?', x - 14, y - 20); g.strokeText('?', x + 14, y - 20);
      g.fillStyle = '#fff3d1'; g.fillText('?', x - 14, y - 20); g.fillText('?', x + 14, y - 20);
      if (gold) { const s = Math.abs(Math.sin(t * 3)); ell(x + 20, y - 40, 3 * s, 3 * s, '#fff'); ell(x - 18, y - 6, 2 * (1 - s), 2 * (1 - s), '#fff'); }
      break;
    }
  }
  g.restore();
}

function drawZombie(z, ox, oy) {
  const x = ox != null ? ox : z.x, y = oy != null ? oy : cellCY(z.row) + 32 + (z.rowShift || 0);
  const burnt = z.burnt && z.dead;
  const moving = !z.eating && z.frozen <= 0 && !z.dead;
  const fast = z.type === 'football' || (z.type === 'pole' && z.pole);
  const ph = moving ? Math.sin(z.anim * (fast ? 9 : 5)) : 0;
  g.save();
  if (z.dead) {
    if (burnt) g.globalAlpha = 1 - clamp01((z.deadT - 0.55) / 0.25);
    else {
      const k = Math.min(1, z.deadT / 0.45);
      g.globalAlpha = 1 - clamp01((z.deadT - 0.6) / 0.4);
      g.translate(x + 10, y); g.rotate(k * 1.45); g.translate(-x - 10, -y);
    }
  } else shadow(x, y + 2, 22);
  if (z.jumping > 0) g.translate(0, -Math.sin((1 - z.jumping / 0.8) * Math.PI) * 55);
  const skin = burnt ? '#2a2a2a' : z.flash > 0 ? '#d6ead0' : z.slow > 0 ? '#9cc6d6' : '#a6bf9b';
  const coat = burnt ? '#1c1c1c' : z.type === 'football' ? '#b3262e' : '#6b6f5e';
  const legC = burnt ? '#151515' : '#3b3a35';
  const edge = burnt ? '#000' : '#2e3029';
  // 腿
  line(x - 2, y - 30, x - 8 + ph * 7, y - 2, legC, 7);
  line(x + 3, y - 30, x + 8 - ph * 7, y - 2, legC, 7);
  ell(x - 11 + ph * 7, y, 7, 3.5, '#24231f');
  ell(x + 5 - ph * 7, y, 7, 3.5, '#24231f');
  // 旗子
  if (z.type === 'flag') {
    line(x + 14, y - 40, x + 18, y - 116, '#6b4a2b', 3);
    const wv = Math.sin(z.anim * 6) * 3;
    g.beginPath(); g.moveTo(x + 18, y - 116);
    g.quadraticCurveTo(x + 30, y - 116 + wv, x + 44, y - 114);
    g.lineTo(x + 44, y - 94);
    g.quadraticCurveTo(x + 30, y - 96 + wv, x + 18, y - 96);
    g.closePath(); g.fillStyle = burnt ? '#222' : '#c8202c'; g.fill(); g.strokeStyle = '#5c0b10'; g.lineWidth = 2; g.stroke();
    ell(x + 31, y - 105, 4.5, 4.5, burnt ? '#333' : '#fff3d1');
  }
  // 后臂
  line(x + 9, y - 60, x + 15, y - 37 + ph * 3, coat, 6);
  // 身体
  poly([x - 14, y - 28, x + 14, y - 28, x + 12, y - 67, x - 12, y - 67], coat, edge);
  if (z.type === 'football') {
    ell(x - 12, y - 64, 10, 7, burnt ? '#222' : '#8a1820', edge, 2);
    ell(x + 12, y - 64, 10, 7, burnt ? '#222' : '#8a1820', edge, 2);
    g.font = `16px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = burnt ? '#333' : '#fff3d1';
    g.fillText('12', x, y - 44);
  } else if (!burnt) {
    poly([x - 6, y - 67, x + 6, y - 67, x, y - 56], '#efe9d8');
    poly([x - 2, y - 62, x + 2, y - 62, x + 3, y - 44, x, y - 40, x - 3, y - 44], '#b3261e');
  }
  // 撑杆
  if (z.pole && z.jumping <= 0) line(x + 24, y - 54, x - 46, y - 40, '#8a5a2e', 4);
  if (z.jumping > 0) line(x - 30, y + 30, x - 4, y - 70, '#8a5a2e', 4);
  // 头
  if (!z.headOff) {
    const hx = x - 4, hy = y - 81;
    ell(hx, hy, 15, 15, skin, burnt ? '#000' : '#4f5e47');
    if (!burnt) {
      ell(hx - 6, hy - 3, 4.5, 5.5, '#fff', '#4f5e47', 1);
      ell(hx + 5, hy - 4, 4, 5, '#fff', '#4f5e47', 1);
      ell(hx - 7, hy - 2, 1.8, 1.8, '#222');
      ell(hx + 4, hy - 3, 1.6, 1.6, '#222');
      const mouth = z.eating && z.frozen <= 0 ? 2 + Math.abs(Math.sin(z.anim * 10)) * 4 : 1.6;
      ell(hx - 6, hy + 8, 5, mouth, '#3a1b1b');
    } else {
      ell(hx - 6, hy - 3, 3, 3, '#fff'); ell(hx + 5, hy - 4, 3, 3, '#fff');
    }
    drawArmor(z, hx, hy, burnt);
  }
  // 前臂
  if (!z.armOff) {
    const reach = z.eating ? Math.sin(z.anim * 10) * 3 : ph * 3;
    line(x - 6, y - 60, x - 27, y - 56 + reach, coat, 6);
    ell(x - 29, y - 56 + reach, 4, 4, skin);
  } else line(x - 6, y - 60, x - 12, y - 56, coat, 6);
  if (z.frozen > 0 && !z.dead) {
    rr(x - 26, y - 104, 52, 106, 8);
    g.fillStyle = 'rgba(150,215,255,.42)'; g.fill();
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 2; g.stroke();
    line(x - 18, y - 90, x - 8, y - 96, 'rgba(255,255,255,.8)', 2);
  }
  g.restore();
}
function drawArmor(z, hx, hy, burnt) {
  if (z.armor <= 0) return;
  const dmg = z.maxArmor ? z.armor / z.maxArmor : 1;
  if (z.armorType === 'cone') {
    poly([hx - 15, hy - 7, hx + 14, hy - 7, hx + 2, hy - 42], burnt ? '#222' : '#f08a24', burnt ? '#000' : '#8a4510');
    line(hx - 8, hy - 20, hx + 9, hy - 20, 'rgba(255,255,255,.22)', 3);
    if (dmg < 0.5) line(hx - 2, hy - 34, hx + 4, hy - 24, '#5a2a05', 2);
  } else if (z.armorType === 'bucket') {
    poly([hx - 16, hy - 4, hx + 16, hy - 4, hx + 12, hy - 33, hx - 12, hy - 33], burnt ? '#222' : '#a9b2b7', burnt ? '#000' : '#4b5257');
    line(hx - 15, hy - 12, hx + 15, hy - 12, '#4b5257', 2);
    if (dmg < 0.5) { line(hx - 6, hy - 30, hx - 1, hy - 20, '#4b5257', 2); line(hx + 6, hy - 26, hx + 9, hy - 18, '#4b5257', 2); }
  } else if (z.armorType === 'football') {
    g.beginPath(); g.arc(hx, hy - 1, 17, Math.PI * 1.02, Math.PI * 2.02); g.closePath();
    g.fillStyle = burnt ? '#222' : '#c8202c'; g.fill(); g.strokeStyle = burnt ? '#000' : '#5c0b10'; g.lineWidth = 2.5; g.stroke();
    line(hx - 17, hy + 2, hx - 17, hy + 12, '#9aa3a8', 2.5);
    line(hx - 17, hy + 6, hx - 6, hy + 6, '#9aa3a8', 2.5);
    poly([hx - 9, hy - 16, hx + 9, hy - 16, hx + 7, hy - 30, hx - 7, hy - 30], burnt ? '#222' : '#a9b2b7', burnt ? '#000' : '#4b5257', 2);
    if (dmg < 0.5) line(hx - 4, hy - 12, hx + 6, hy - 4, '#3a0507', 2);
  }
}

function drawSun(x, y, t, a = 1) {
  g.save(); g.globalAlpha *= a;
  ell(x, y, 27, 27, 'rgba(255,210,63,.28)');
  g.save(); g.translate(x, y); g.rotate(t * 0.8);
  g.fillStyle = '#ffc21a';
  for (let i = 0; i < 8; i++) {
    g.rotate(Math.PI / 4);
    g.beginPath(); g.moveTo(-5, -15); g.lineTo(5, -15); g.lineTo(0, -25); g.closePath(); g.fill();
  }
  g.restore();
  ell(x, y, 15, 15, '#ffd23f', '#e09b00', 2);
  ell(x - 5, y - 5, 5, 4, 'rgba(255,255,255,.6)');
  g.restore();
}

function drawPart(p) {
  const a = 1 - clamp01((p.t - p.life * 0.6) / (p.life * 0.4));
  g.save(); g.globalAlpha = a; g.translate(p.x, p.y); g.rotate(p.rot);
  switch (p.shape) {
    case 'circle': ell(0, 0, p.size, p.size, p.color); break;
    case 'rect': g.fillStyle = p.color; g.fillRect(-p.size, -p.size * 0.6, p.size * 2, p.size * 1.2); break;
    case 'head':
      ell(0, 0, 15, 15, '#a6bf9b', '#4f5e47');
      ell(-6, -3, 4.5, 5.5, '#fff', '#4f5e47', 1); ell(-7, -2, 1.8, 1.8, '#222');
      line(3, -6, 8, -1, '#4f5e47', 1.5); line(8, -6, 3, -1, '#4f5e47', 1.5);
      break;
    case 'cone': poly([-15, 16, 14, 16, 2, -18], '#f08a24', '#8a4510'); break;
    case 'bucket': poly([-16, 14, 16, 14, 12, -14, -12, -14], '#a9b2b7', '#4b5257'); break;
    case 'football':
      g.beginPath(); g.arc(0, 8, 17, Math.PI * 1.02, Math.PI * 2.02); g.closePath();
      g.fillStyle = '#c8202c'; g.fill(); g.strokeStyle = '#5c0b10'; g.lineWidth = 2.5; g.stroke();
      break;
    case 'arm': line(0, 0, -18, 4, '#6b6f5e', 6); ell(-20, 4, 4, 4, '#a6bf9b'); break;
    case 'pole': line(-30, 0, 30, 0, '#8a5a2e', 4); break;
  }
  g.restore();
}

function drawLawn() {
  g.fillStyle = '#4a3320'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#c7a873'; g.fillRect(0, TOP, LX, CH * ROWS);
  for (let i = 0; i < ROWS * 3; i++) line(0, TOP + i * 30 + 15, LX - 4, TOP + i * 30 + 15, 'rgba(120,90,50,.35)', 2);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    g.fillStyle = (r + c) % 2 ? '#79c043' : '#6cb438';
    g.fillRect(LX + c * CW, TOP + r * CH, CW, CH);
  }
  // 草叶点缀（固定位置）
  g.fillStyle = 'rgba(40,100,20,.25)';
  for (let i = 0; i < 60; i++) {
    const gx = LX + ((i * 137) % (CW * COLS)), gy = TOP + ((i * 211) % (CH * ROWS));
    g.fillRect(gx, gy, 2, 6); g.fillRect(gx + 4, gy + 2, 2, 5);
  }
  const sx = LX + CW * COLS;
  g.fillStyle = '#7d7f78'; g.fillRect(sx, TOP, W - sx, CH * ROWS);
  g.fillStyle = '#9a9c94'; g.fillRect(sx, TOP, 8, CH * ROWS);
  for (let i = 0; i < 6; i++) { g.fillStyle = '#e8e3c8'; g.fillRect(sx + 44, TOP + 12 + i * 78, 6, 40); }
  g.fillStyle = '#3e2611'; g.fillRect(0, H - 10, W, 10);
}

function drawHUD() {
  g.fillStyle = '#4a3320'; g.fillRect(0, 0, W, TOP);
  g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(0, TOP - 3, W, 3);
  g.font = `20px ${FONT}`; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = '#fff3d1';
  g.fillText(CFG.waves === Infinity ? `无尽 · 第 ${Math.max(1, S.waveNum)} 波` : CFG.label, 14, TOP / 2 + 1);
  const bx = W - 240, bw = 220, by = 13, bh = 14;
  if (CFG.waves !== Infinity) {
    rr(bx, by, bw, bh, 7); g.fillStyle = '#2a1c10'; g.fill();
    const k = clamp01(S.t / S.endT);
    if (k > 0) { rr(bx + bw * (1 - k), by, bw * k, bh, 7); g.fillStyle = '#7fd14a'; g.fill(); }
    S.waveTimes.forEach((wt, i) => {
      if (!isFlag(i + 1)) return;
      const fx = bx + bw * (1 - wt / S.endT);
      line(fx, by - 4, fx, by + bh + 1, '#efe9d8', 2);
      poly([fx, by - 4, fx + 10, by, fx, by + 4], S.t >= wt ? '#e3263a' : '#b98a5a');
    });
    ell(bx + bw * (1 - k), by + bh / 2, 9, 9, '#a6bf9b', '#2e3029', 2);
  } else {
    g.textAlign = 'right'; g.fillStyle = '#ffd23f';
    g.fillText(`已消灭 ${S.kills}`, W - 20, TOP / 2 + 1);
  }
  g.font = `15px ${FONT}`; g.textAlign = 'center'; g.fillStyle = '#e8d6a8';
  let hint = '点卡片选植物，再点草坪种下';
  if (S.selected === 'shovel') hint = '铲子：点一株植物把它移走';
  else if (S.selected) hint = `${PLANTS[S.selected].name}：${PLANTS[S.selected].desc}`;
  if (!S.demo) g.fillText(hint, (210 + bx - 14) / 2, TOP / 2 + 1);
}

function bigText(text, x, y, size, fill, stroke, scale = 1) {
  g.save(); g.translate(x, y); g.scale(scale, scale);
  g.font = `${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = size / 6; g.lineJoin = 'round'; g.strokeStyle = stroke; g.strokeText(text, 0, 0);
  g.fillStyle = fill; g.fillText(text, 0, 0);
  g.restore();
}

function drawFx(f) {
  const k = f.t / f.dur;
  if (f.type === 'boom' && f.big) {
    ell(f.x, f.y, 60 + k * 300, 40 + k * 200, `rgba(90,20,110,${0.7 * (1 - k)})`);
    ell(f.x, f.y, 40 + k * 200, 30 + k * 130, `rgba(255,120,30,${0.8 * (1 - k)})`);
    ell(f.x, f.y, 80 + k * 380, 55 + k * 250, null, `rgba(255,255,255,${0.8 * (1 - k)})`, 6);
    if (k < 0.7) bigText('轰！！', f.x, f.y - 30, 60, '#ffe36b', '#2a0a33', 1 + (1 - k) * 0.4);
  } else if (f.type === 'boom') {
    ell(f.x, f.y, 40 + k * 120, 30 + k * 85, `rgba(255,120,30,${0.75 * (1 - k)})`);
    ell(f.x, f.y, 20 + k * 75, 16 + k * 55, `rgba(255,230,120,${0.9 * (1 - k)})`);
    ell(f.x, f.y, 50 + k * 160, 35 + k * 110, null, `rgba(255,255,255,${0.8 * (1 - k)})`, 4);
    if (k < 0.6) bigText('嘭！', f.x, f.y - 20, 40, '#ffe36b', '#4a1405', 1 + (1 - k) * 0.3);
  } else if (f.type === 'ice') {
    ell(f.x, f.y, 30 + k * 150, 20 + k * 95, `rgba(160,220,255,${0.7 * (1 - k)})`, `rgba(255,255,255,${1 - k})`, 3);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, d = 20 + k * 90;
      line(f.x + Math.cos(a) * d * 0.5, f.y + Math.sin(a) * d * 0.35, f.x + Math.cos(a) * d, f.y + Math.sin(a) * d * 0.7, `rgba(255,255,255,${1 - k})`, 3);
    }
  } else if (f.type === 'fireline') {
    const a = 1 - k;
    g.fillStyle = `rgba(255,90,20,${0.35 * a})`; g.fillRect(LX, f.y - CH / 2, W - LX, CH);
    for (let i = 0; i < 12; i++) {
      const fx = LX + 30 + i * 66, h = 1.2 + Math.sin(f.t * 20 + i) * 0.3;
      g.save(); g.globalAlpha = a; flame(fx, f.y + 36, 26 * h, f.t + i); g.restore();
    }
  } else if (f.type === 'plant') {
    for (let i = 0; i < 5; i++) ell(f.x - 24 + i * 12, f.y - k * 10, 7 * (1 - k), 5 * (1 - k), `rgba(122,85,48,${1 - k})`);
  }
}

function draw() {
  g = ctx;
  const t = S.t + S.intro;
  g.save();
  if (S.shake > 0) g.translate(rnd(-S.shake, S.shake) * 0.5, rnd(-S.shake, S.shake) * 0.5);
  drawLawn();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const left = S.craters[r][c];
    if (left > 0) {
      g.save(); g.globalAlpha = Math.min(1, left / 3);
      ell(cellCX(c), cellCY(r) + 24, 34, 14, '#3e2611', '#2a1a0c', 2);
      ell(cellCX(c), cellCY(r) + 22, 24, 8, '#24160a');
      g.restore();
    }
  }
  if (S.hover && S.selected && !S.over) {
    const { r, c } = S.hover;
    const occupied = !!S.plants[r][c] || S.craters[r][c] > 0;
    if (S.selected === 'shovel') {
      if (occupied) { g.fillStyle = 'rgba(255,80,60,.25)'; g.fillRect(LX + c * CW, TOP + r * CH, CW, CH); }
    } else {
      g.fillStyle = 'rgba(255,255,255,.12)';
      g.fillRect(LX, TOP + r * CH, CW * COLS, CH);
      g.fillStyle = occupied ? 'rgba(255,80,60,.22)' : 'rgba(255,255,255,.22)';
      g.fillRect(LX + c * CW, TOP + r * CH, CW, CH);
      if (!occupied) { g.save(); g.globalAlpha = 0.45; drawPlant(S.selected, cellCX(c), cellCY(r) + 28, t, null); g.restore(); }
    }
  }
  S.mowers.forEach((m, r) => {
    if (m.state === 'done') return;
    const y = cellCY(r) + 16, jig = m.state === 'go' ? rnd(-1, 1) : 0;
    rr(m.x, y - 16 + jig, 36, 18, 4); g.fillStyle = '#d0332b'; g.fill(); g.strokeStyle = '#5c1410'; g.lineWidth = 2; g.stroke();
    line(m.x + 4, y - 16 + jig, m.x - 6, y - 32, '#3b3a35', 3);
    ell(m.x + 8, y + 4, 6, 6, '#222'); ell(m.x + 28, y + 4, 6, 6, '#222');
  });
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = S.plants[r][c];
      if (p && !p.atk) drawPlant(p.type, cellCX(c), cellCY(r) + 28, t, p);
    }
    S.zombies.filter(z => z.row === r).sort((a, b) => a.x - b.x).forEach(z => drawZombie(z));
    for (let c = 0; c < COLS; c++) {
      const p = S.plants[r][c];
      if (p && p.atk) drawPlant(p.type, cellCX(c), cellCY(r) + 28, t, p);
    }
  }
  for (const p of S.peas) {
    if (p.kind === 'fire') {
      ell(p.x - 11, p.y, 11, 5, 'rgba(255,177,43,.5)');
      ell(p.x, p.y, 8, 8, '#ff8a2b', '#b8360a', 1.5);
      ell(p.x + 1, p.y - 1, 4, 4, '#ffe36b');
    } else if (p.kind === 'ice') {
      ell(p.x - 9, p.y, 9, 4, 'rgba(191,233,255,.6)');
      ell(p.x, p.y, 7, 7, '#9fe2ff', '#1f5f86', 1.5);
      ell(p.x - 2, p.y - 2, 2.5, 2, '#fff');
    } else {
      ell(p.x, p.y, 7, 7, '#8fe04a', '#2f6b1c', 1.5);
      ell(p.x - 2, p.y - 2, 2.5, 2, 'rgba(255,255,255,.7)');
    }
  }
  for (const l of S.lobs) {
    const k = Math.min(1, l.t / l.dur), ty = cellCY(l.row) - 20;
    const lx = l.sx + (l.tx - l.sx) * k, ly = l.sy + (ty - l.sy) * k - Math.sin(k * Math.PI) * 120;
    ell(lx, cellCY(l.row) + 30, 10 * (0.5 + k * 0.5), 4, 'rgba(0,0,0,.15)');
    g.save(); g.translate(lx, ly); g.rotate(k * 6);
    ell(0, 0, 13, 11, '#8fd8c8', '#1f5f6a', 2);
    line(-6, -9, -6, 9, 'rgba(31,95,106,.5)', 2); line(2, -10, 2, 10, 'rgba(31,95,106,.5)', 2);
    ell(-4, -4, 3, 2, '#fff');
    g.restore();
  }
  for (const f of S.fx) drawFx(f);
  for (const p of S.parts) drawPart(p);
  for (const s of S.suns) {
    if (s.fly) {
      const k = Math.min(1, s.flyT / 0.5), e = 1 - (1 - k) * (1 - k);
      drawSun(s.sx + (20 - s.sx) * e, s.sy + (20 - s.sy) * e, t, 1 - k * 0.6);
    } else drawSun(s.x, s.y, t, s.life < 2 ? 0.4 + 0.6 * Math.abs(Math.sin(s.life * 8)) : 1);
  }
  for (const tx of S.texts) {
    const k = tx.t;
    g.save(); g.globalAlpha = 1 - clamp01((k - 0.6) / 0.4);
    bigText(tx.text, tx.x, tx.y - k * 30, tx.size, tx.color, '#3e2611', k < 0.15 ? 0.6 + k / 0.15 * 0.4 : 1);
    g.restore();
  }
  g.restore();
  if (!S.demo) drawHUD();
  if (S.flashA > 0) { g.fillStyle = `rgba(255,250,230,${S.flashA})`; g.fillRect(0, 0, W, H); }
  if (!S.demo && S.intro < INTRO) {
    const step = Math.min(2, Math.floor(S.intro / (INTRO / 3)));
    const local = (S.intro % (INTRO / 3)) / (INTRO / 3);
    const txt = ['准备……', '安放……', '植物！'][step];
    bigText(txt, W / 2, H / 2, step === 2 ? 64 : 48, step === 2 ? '#ff4b3a' : '#fff3d1', '#3a0d0a', 0.7 + Math.min(1, local * 4) * 0.3);
  }
  if (S.banner) {
    const k = Math.min(1, S.banner.t / 0.25);
    bigText(S.banner.text, W / 2, H / 2, 46, '#ff4b3a', '#3a0d0a', 0.6 + 0.4 * k);
  }
}

// 在一个 100×100 的逻辑画布上画图标
function drawIcon(canvas, kind, key, opt = {}) {
  const c2 = canvas.getContext('2d');
  const prev = g; g = c2;
  const s = canvas.width / 100;
  c2.setTransform(s, 0, 0, s, 0, 0);
  c2.clearRect(0, 0, 100, 100);
  if (kind === 'plant') {
    g.translate(46, 90); g.scale(1.05, 1.05);
    drawPlant(key, 0, 0, 0, null);
  } else if (kind === 'zombie') {
    g.translate(56, 97); g.scale(0.7, 0.7);
    const d = ZDEF[key];
    drawZombie({ type: key, armor: d.armor, maxArmor: d.armor, armorType: d.armorType, pole: !!d.pole, jumping: 0, frozen: 0, slow: 0, flash: 0, anim: 0, eating: false, dead: false }, 0, 0);
  } else if (kind === 'sun') {
    g.translate(50, 50); g.scale(1.6, 1.6); drawSun(0, 0, 0);
  } else if (kind === 'shovel') {
    line(30, 74, 64, 34, '#8a5a2e', 8);
    line(22, 82, 36, 66, '#3b3a35', 9);
    poly([58, 24, 84, 18, 80, 44, 64, 44], '#b8c0c4', '#4b5257', 3);
  }
  if (opt.locked) {
    c2.setTransform(1, 0, 0, 1, 0, 0);
    c2.globalCompositeOperation = 'source-atop';
    c2.fillStyle = '#4a3a24'; c2.fillRect(0, 0, canvas.width, canvas.height);
    c2.globalCompositeOperation = 'source-over';
  }
  g = prev;
}
function iconCanvas(kind, key, px, opt) {
  const c = document.createElement('canvas');
  c.width = c.height = Math.round(px * Math.min(3, window.devicePixelRatio || 1));
  drawIcon(c, kind, key, opt);
  return c;
}

/* ---------- 浮层通用 ---------- */
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}
function btn(label, fn, cls = '') { return el('button', { class: 'btn ' + cls, onclick: () => { sfx('select'); fn(); } }, label); }
function openOverlay(node, soft = false) {

  overlay.append(node);
  overlay.hidden = false;
  const f = overlay.querySelector('button:not(:disabled)');
  if (f) f.focus({ preventScroll: true });
}
function closeOverlay() { overlay.hidden = true; overlay.innerHTML = ''; }
function panel(cls, ...kids) { return el('div', { class: 'panel ' + cls }, ...kids); }

      el('p', {}, `坚持了 ${Math.floor(S.t)} 秒，消灭 ${S.kills} 只僵尸。试试先多种几株豌豆向日葵攒阳光。`),
      el('div', { class: 'btns' }, btn('再试一次', () => startGame(CFG, S.deck)), btn('主菜单', showMenu, 'alt')))), 900);
    return;
  }
  sfx('win');
  for (let i = 0; i < 40; i++) part({ x: rnd(LX, W), y: TOP - 10, vx: rnd(-40, 40), vy: rnd(0, 120), grav: 150, life: rnd(1.2, 2), size: rnd(3, 6), color: ['#ffd23f', '#e3263a', '#7fd14a', '#7fd3ff', '#fff3d1'][i % 5], shape: 'rect', vr: rnd(-8, 8) });
  if (CFG.mode === 'adventure') {
    const i = CFG.idx, first = !save.cleared.includes(i);
    if (first) save.cleared.push(i);
    if (i === 0) unlockAch('first');
    if (i === LEVELS.length - 1) unlockAch('master');
    if (!S.mowerUsed) unlockAch('nomower');
    persist();
    if (first) {
      const k = LEVELS[i].reward;
      body.push(el('div', { class: 'reward' }, iconCanvas('plant', k, 64), el('div', {}, el('b', {}, `获得新植物：${PLANTS[k].name}`), el('p', {}, PLANTS[k].desc))));
      setTimeout(() => sfx('unlock'), 700);
    }
    body.unshift(el('p', {}, `守住了 ${CFG.waves} 波进攻，消灭 ${S.kills} 只僵尸${S.mowerUsed ? '' : '，小推车一辆没动'}。`));
    if (i + 1 < LEVELS.length) btns.push(btn(`下一关 ${LEVELS[i + 1].id}`, () => startFlow(advCfg(i + 1))));
    btns.push(btn('关卡列表', showLevels, 'alt'), btn('主菜单', showMenu, 'alt'));
  } else if (CFG.mode === 'lucky') {
    save.luckyWin = true;
    unlockAch('luckywin');
    persist();
    body.push(el('p', {}, `守住了 ${CFG.waves} 波，消灭 ${S.kills} 只僵尸${S.boxZombies ? `，盒子里跳出过 ${S.boxZombies} 只僵尸` : ''}。`));
    body.push(el('p', {}, `图鉴里已经开出过 ${Object.keys(save.boxGot).length}/${PLANT_ORDER.length} 种植物。`));
    btns.push(btn('再开一局', () => startGame(CFG, S.deck)), btn('主菜单', showMenu, 'alt'));
  } else {
    save.chal[CFG.id] = true;
    if (CHALLENGES.every(c => save.chal[c.id])) unlockAch('challenger');
    persist();
    body.push(el('p', {}, `挑战完成，消灭 ${S.kills} 只僵尸。`));
    btns.push(btn('挑战列表', showChallenges), btn('主菜单', showMenu, 'alt'));
  }
  setTimeout(() => openOverlay(panel('', el('h1', {}, '守住了！'), el('p', { class: 'sub' }, CFG.label), ...body, el('div', { class: 'btns' }, ...btns))), 1200);
}

function startGame(cfg, deck) {
  S = newState(cfg, deck);
  // 幸运盒子：开局每行送一株豌豆向日葵，保证每行都有攻击
  if (cfg.freeRow) for (let r = 0; r < ROWS; r++) { const p = makePlant(cfg.freeRow); p.age = 1; S.plants[r][0] = p; }
  buildCards(deck);
  bankEl.hidden = false;
  running = true; paused = false; lastUI = {};
  pauseBtn.textContent = '暂停';
  closeOverlay();
  wantMusic = 'game'; Sound.music('game');
  requestAnimationFrame(fit);
}

/* ---------- 输入 ---------- */
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function cellAt(x, y) {
  const c = Math.floor((x - LX) / CW), r = Math.floor((y - TOP) / CH);
  return c >= 0 && c < COLS && r >= 0 && r < ROWS ? { r, c } : null;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!playable()) return;
  const { x, y } = toWorld(e);
  let best = null, bd = 44;
  for (const s of S.suns) {
    if (s.fly) continue;
    const d = Math.hypot(s.x - x, s.y - y);
    if (d < bd) { bd = d; best = s; }
  }
  if (best) {
    best.fly = true; best.sx = best.x; best.sy = best.y;
    S.sun += best.value;
    floatText(best.x, best.y - 10, '+' + best.value, '#ffe36b', 22);
    for (let i = 0; i < 6; i++) part({ x: best.x, y: best.y, vx: rnd(-120, 120), vy: rnd(-120, 120), grav: 0, life: 0.35, size: rnd(2, 4), color: '#fff3a0' });
    sfx('sun');
    return;
  }
  const cell = cellAt(x, y);
  S.hover = e.pointerType === 'mouse' ? cell : null;
  if (!cell || !S.selected) return;
  const { r, c } = cell;
  if (S.selected === 'shovel') {
    if (S.plants[r][c]) {
      S.plants[r][c] = null;
      S.fx.push({ type: 'plant', x: cellCX(c), y: cellCY(r) + 28, t: 0, dur: 0.4 });
      sfx('plant');
    }
    S.selected = null;
    return;
  }
  const k = S.selected, d = PLANTS[k];
  if (S.plants[r][c]) { sfx('cant'); return; }
  if (S.craters[r][c] > 0) { sfx('cant'); floatText(cellCX(c), cellCY(r), '坑还没填好', '#fff3d1', 16); return; }
  if (S.sun < d.cost) { nope(); S.selected = null; return; }
  S.plants[r][c] = makePlant(k);
  S.sun -= d.cost;
  S.cd[k] = d.cd;
  S.selected = null;
  S.fx.push({ type: 'plant', x: cellCX(c), y: cellCY(r) + 28, t: 0, dur: 0.4 });
  for (let i = 0; i < 8; i++) part({ x: cellCX(c) + rnd(-20, 20), y: cellCY(r) + 30, vx: rnd(-90, 90), vy: rnd(-200, -80), life: 0.5, size: rnd(2, 4), color: i % 2 ? '#7a5530' : '#5b3a1c', ground: cellCY(r) + 34 });
  sfx('plant');
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || !S) return;
  const { x, y } = toWorld(e);
  S.hover = cellAt(x, y);
});
cv.addEventListener('pointerleave', () => { if (S) S.hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (!running || S.over || S.demo) return;
  if (e.key === ' ') { e.preventDefault(); setPaused(!paused); return; }
  if (paused) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= S.deck.length) selectCard(S.deck[n - 1]);
  else if (e.key === 's' || e.key === 'S') shovelBtn.click();
  else if (e.key === 'Escape') S.selected = null;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running && !paused && !S.over && !S.demo) setPaused(true);
});

/* ================= 尺寸与主循环 ================= */
function fit() {
  const r = stage.getBoundingClientRect();
  const scale = Math.max(0.1, Math.min(r.width / W, r.height / H));
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
new ResizeObserver(fit).observe(stage);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.demo) update(dt);
  else if (running && !paused && !S.over) for (let i = 0; i < speed; i++) { update(dt); if (S.over) break; }
  else if (S.over) updateEffects(dt);
  draw();
  updateUI();
  requestAnimationFrame(frame);
}

showMenu();
fit();
if (document.fonts && document.fonts.load) document.fonts.load(`20px ${FONT}`).then(() => {}, () => {});
requestAnimationFrame(frame);

window.__pvz = { get S() { return S; }, get CFG() { return CFG; }, update, startGame, startFlow, advCfg, chalCfg, endlessCfg, luckyCfg, rollBox, showMenu, showAlmanac, save: () => save, LEVELS };
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
